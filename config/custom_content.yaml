# =============================================================================
# 定制化内容配置：账号人设 + 自有内容库 + 固定栏目
# 这些内容会注入到文案生成的提示词中，与热点混合生成"定制化爆款文案"
# （tasks.yaml 的 daily_post.custom_content 指向本文件；不配置则只用热点）
# =============================================================================

account:
  # 账号人设（注入所有平台的生成提示词）
  persona: "一个热爱生活、擅长挖掘细节的美食与生活方式博主，粉丝主要是 20-35 岁城市青年"
  tone: "亲切、真诚、适度幽默，偶尔用网络流行语"
  fixed_hashtags: ["美食", "探店", "生活方式"]   # 每篇必带的固定话题
  exclude_topics: ["政治", "医疗", "金融投资"]    # 永不触碰的话题（热点命中则跳过）

# 自有内容库：把你想推的产品/门店/服务写进来，AI 会找机会融入文案
custom_materials:
  - name: "手打柠檬茶店「青柠小铺」"
    type: "product"
    detail: "主打香水柠檬手打柠檬茶，位于城南路 88 号，营业到晚上 11 点"
    hooks: ["水果现切现打，看得到真材实料", "第二杯半价活动到月底", "加 5 元换购芝士奶盖"]

# 固定栏目：周期性发布的内容模板（AI 会按时段/主题生成）
columns:
  - name: "周末探店"
    schedule_hint: "每周五发布，推荐本周末值得去的店"
    topic_hint: "围绕本地新店、老店情怀、性价比三个角度"

# 混合比例：热点与定制内容的配比（用于提示词引导）
mix:
  hot_topic_weight: 0.6     # 以热点为灵感的比例
  custom_weight: 0.4        # 融入定制内容的比例
