[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

# 1. 虚拟显示器（浏览器窗口都在这个桌面上）
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
startsecs=2
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

# 2. 轻量窗口管理器（给 Chromium 窗口提供标题栏/切换）
[program:openbox]
command=/usr/bin/openbox
autostart=true
autorestart=true
priority=5
environment=DISPLAY=":99"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

# 3. x11vnc：把桌面导出到 VNC（noVNC 通过 websockify 转 WebSocket）
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbauth /etc/vnc-secret -rfbport 5900 -noxdamage -ncache 10 -quiet
autostart=true
autorestart=true
priority=10
environment=DISPLAY=":99"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

# 4. noVNC：网页远程桌面（http://<host>:6080/vnc.html）
[program:novnc]
command=/usr/bin/websockify 6080 --web=/usr/share/novnc localhost:5900
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

# 5. 账号浏览器守护：HTTP API（agent 通过它要/复用每账号 Chromium 实例）
[program:browser-mgr]
command=python3 /opt/browser-gui/profile_manager.py
autostart=true
autorestart=true
priority=20
environment=DISPLAY=":99",ADVERTISED_HOST="%(ENV_ADVERTISED_HOST)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
